# rQuant 盘中全景页对外入口（basic auth + WebSocket）
# 放 /etc/nginx/conf.d/ 或宝塔站点配置；密码文件用 htpasswd 生成
server {
    listen 18080;
    server_name _;

    auth_basic "rQuant Panorama";
    auth_basic_user_file /etc/nginx/.htpasswd-panorama;

    location / {
        proxy_pass http://127.0.0.1:18506;
        # Streamlit 依赖 WebSocket，缺这三行页面白屏
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
