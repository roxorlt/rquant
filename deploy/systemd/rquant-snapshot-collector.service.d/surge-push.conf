# Surge scanner push: read only PUSHDEER_KEYS / PUSHDEER_ENDPOINT from this file (parsed by
# rquant.research.surge, not loaded into the environment). SURGE_PUSH=0 disables push,
# SURGE_SCAN=0 disables the scanner; touch snapshots/SURGE_NOPUSH to mute for the day.
[Service]
Environment=SURGE_PUSH_ENV_FILE=/home/lighthouse/rquant/.env
