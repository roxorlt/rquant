# 2026-10-16: same as report-tracking; Tue-Fri 06:30 + 2h = 08:30, still before 09:10.
[Service]
TimeoutStartSec=2h
# rquant-research.slice is capped at MemoryHigh=1200M/Max=1536M (sized for the collector);
# replication needs ~2-3G, so it sat in mem_cgroup_handle_over_high (D state) until the
# timeout. Run in the uncapped maintenance slice with its own cap instead (off-hours only).
Slice=rquant-maintenance.slice
MemoryHigh=3500M
MemoryMax=4G
