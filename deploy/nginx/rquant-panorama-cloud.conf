# rQuant 盘中全景页对外入口（云端直跑，零隧道 + 微信友好 cookie 登录网关）
# 安装到 /www/server/panel/vhost/nginx/panorama.conf（宝塔自动加载）。
# 详细部署：docs/deploy/2026-07-06-panorama-login-gate-deploy.md
#
# 拓扑：手机/朋友（含微信内置浏览器）→ 本 server:28080
#   ├ 已登录（带有效签名 cookie）→ auth_request 子请求校验 200 → 反代 127.0.0.1:8506（全景页 streamlit）
#   └ 未登录 → auth_request 返 401 → error_page 跳 /login → 登录服务（127.0.0.1:8507）返回登录表单
#        用户 POST /login → 登录服务校验 pbkdf2 → Set-Cookie 签名令牌（30 天）→ 302 回 /
#
# 依赖：登录服务 rquant-panorama-auth.service 常驻监听 127.0.0.1:8507（deploy/systemd/）。
#   —— 相较旧 basic auth 版：微信内置浏览器不支持 basic auth（不弹框直接 401），改 cookie
#      登录页后微信里点链接即可登录。旧 .htpasswd-panorama 保留备用（回滚用），不删。
server {
    listen 28080;
    server_name _;

    # auth_request 内部校验端点：把浏览器 Cookie 透传给登录服务 /verify，验签+验过期
    # （子请求不带 body、只需 Cookie 头；proxy_pass_request_body off 避免透传正文）。
    location = /_panorama_auth {
        internal;
        proxy_pass http://127.0.0.1:8507/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 登录页（未登录跳这里；本身不做 auth_request 校验，否则死循环）。
    # GET 返回表单、POST 校验并 Set-Cookie，均由登录服务处理。
    location /login {
        proxy_pass http://127.0.0.1:8507/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 全景页本体：先过 auth_request，401 跳登录页。
    location / {
        auth_request /_panorama_auth;
        error_page 401 = @go_login;

        proxy_pass http://127.0.0.1:8506;

        # Streamlit 依赖 WebSocket（/_stcore/stream），缺 Upgrade/Connection 页面白屏。
        # auth_request 子请求是普通 HTTP 能正常校验；已登录 cookie 随 websocket 握手带上，
        # websocket 长连本身不受 auth_request 影响。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location @go_login { return 302 /login; }
}

# ============================================================================
# 降级方案（仅当 nginx 不含 ngx_http_auth_request_module 时启用，二选一）
# ----------------------------------------------------------------------------
# 部署第一步用 `nginx -V 2>&1 | grep -o with-http_auth_request_module` 确认。
# 宝塔编译版通常自带；若缺失（grep 无输出），auth_request 指令会被拒（nginx -t 报
# "unknown directive auth_request"）。此时改用下面的静态令牌 map 版：登录服务只负责
# GET/POST /login（校验 + Set-Cookie），nginx 侧用 map 静态比对 cookie 是否等于一个
# 写死的共享令牌，不做 hmac 验签（安全性弱于主方案，仅应急）。
