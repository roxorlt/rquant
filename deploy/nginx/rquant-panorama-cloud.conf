# rQuant 盘中全景页对外入口（云端直跑，零隧道 + 微信友好 cookie 登录网关）
# 安装到 /www/server/panel/vhost/nginx/panorama.conf（宝塔自动加载）。
# 详细部署：docs/deploy/2026-07-06-panorama-login-gate-deploy.md
#
# == map 固定令牌方案（当前默认）==
# 云端 nginx 编译时**没有** ngx_http_auth_request_module（`nginx -V | grep auth_request`
# 无输出），auth_request 指令不可用。改用 nginx `map` 静态比对 cookie：登录服务下发一个
# **固定网关令牌**（所有已登录用户共用同一 cookie 值），nginx map 认这个字面值放行、
# default 0 拦截。不做 hmac 验签（安全性弱于 auth_request 版；权衡见文件底部「留档」）。
#
# 拓扑：手机/朋友（含微信内置浏览器）→ 本 server:28080
#   ├ 已登录（cookie 值 == 网关令牌）→ map 命中 $rq_panorama_ok=1 → 反代 127.0.0.1:8506（全景页 streamlit）
#   └ 未登录（cookie 缺失/不匹配）→ $rq_panorama_ok=0 → 302 跳 /login → 登录服务（127.0.0.1:8507）返回登录表单
#        用户 POST /login → 登录服务校验 pbkdf2 → Set-Cookie 固定网关令牌（30 天）→ 302 回 /
#
# 依赖：
#   1) 登录服务 rquant-panorama-auth.service 常驻监听 127.0.0.1:8507（deploy/systemd/）。
#   2) map 文件 /www/server/nginx/conf/rq-panorama-gate.map，内容为一行：
#          "<GATE_TOKEN>" 1;
#      GATE_TOKEN = `.venv/bin/rquant panorama-gate-token` 的输出（部署时生成，不 checkin
#      令牌，见部署文档第 5 步）。轮换令牌 = 改 RQUANT_PANORAMA_GATE_TOKEN + 重生成此文件
#      + nginx reload，令全体重登。

# map 指令必须在 http context。本 conf 被宝塔 include 进 http 块，故 map 放 server{} 外
# 顶部即可（不能写进 server 内，否则 nginx -t 报 "map directive is not allowed here"）。
# include 一个独立 map 文件而非把令牌写死在这里 —— conf 可 checkin，令牌只落 map 文件。
map $cookie_rq_panorama $rq_panorama_ok {
    include /www/server/nginx/conf/rq-panorama-gate.map;
    default 0;
}

server {
    listen 28080;
    server_name _;

    # 网关健康探针（不校验 cookie）：nginx/宝塔存活自查用。
    location = /_gate_health { return 200 "ok"; }

    # 登录页（未登录跳这里；本身不做 cookie 校验，否则死循环）。
    # GET 返回表单、POST 校验并 Set-Cookie，均由登录服务处理。
    location /login {
        proxy_pass http://127.0.0.1:8507;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 全景页本体：cookie 未命中网关令牌 → 302 跳登录页。
    location / {
        if ($rq_panorama_ok = 0) { return 302 /login; }

        proxy_pass http://127.0.0.1:8506;

        # Streamlit 依赖 WebSocket（/_stcore/stream），缺 Upgrade/Connection 页面白屏。
        # 已登录 cookie 随 websocket 握手带上，map 比对对 websocket 长连同样生效。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

