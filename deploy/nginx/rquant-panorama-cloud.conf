# nginx（`nginx -V 2>&1 | grep -o with-http_auth_request_module` 有输出），可切回本方案，
# 获得**每用户 hmac 签名令牌**（可单独踢人 = 改 SECRET 令全体失效，per-user 令牌互不相同）。
