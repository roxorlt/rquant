# rQuant 盘中全景页对外入口（云端直跑，零隧道）
# 安装到 /www/server/panel/vhost/nginx/panorama.conf（宝塔自动加载），覆盖旧的隧道反代版
# （旧版 proxy_pass 127.0.0.1:18506 → SSH 反向隧道 → Mac 8506，已被云端直跑取代）。
# 详细部署：docs/deploy/2026-07-06-panorama-cloud-deploy.md
#
# 拓扑：手机/朋友（任意网络）→ 本 server:28080（basic auth）→ 云 127.0.0.1:8506
#   （rquant-panorama.service 的 streamlit；poller 读同机 surge 全市场 feed + 自拉兜底）
#   —— 零隧道、零 Mac 依赖。
server {
    listen 28080;
    server_name _;

    # 全景页 Streamlit 反代（8506 仅绑 127.0.0.1，不直接对外，只给 nginx）
    location / {
        proxy_pass http://127.0.0.1:8506;

        # Streamlit 依赖 WebSocket，缺 Upgrade/Connection 页面白屏
        # （头写法对照 rquant-backup.conf 的 /dashboard/ location）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        # 朋友账号体系原样继承（沿用手工维护的密码文件，不新建）
        auth_basic "rQuant 全景页";
        auth_basic_user_file /www/server/nginx/conf/.htpasswd-panorama;
    }
}
