# rQuant Backup API + Dashboard 反代
# 安装到 /www/server/panel/vhost/nginx/rquant-backup.conf（宝塔自动加载）
# 详细部署：deploy/backup-api.md

# /backup/ 专用 access log 格式（dashboard 解析推断"上次 mac 拉取时间"）
log_format rquant_backup '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent';

server {
    listen 8081;
    server_name _;

    client_max_body_size 0;

    # /backup/ — 静态文件 + basic auth（mac 拉云端 DuckDB 快照）
    location /backup/ {
        alias /home/lighthouse/rquant/backup/;
        autoindex off;

        # 单独 access log，dashboard 读取
        access_log /www/server/nginx/logs/rquant-backup-access.log rquant_backup;

        auth_basic "rQuant Backup";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;

        if ($request_filename !~* \.(duckdb\.gz|json)$) {
            return 403;
        }

        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # /feed/ — surge-watch 全市场快照（Mac panorama poller 第 0 路由拉取）
    # 只暴露 parquet；nginx 静态文件天然带 Last-Modified，Mac 侧据此判 ≤120s 新鲜。
    location /feed/ {
        alias /home/lighthouse/rquant/data/surge_live/;
        autoindex off;

        auth_basic "rQuant Feed";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;

        if ($request_filename !~* \.parquet$) {
            return 403;
        }

        add_header Cache-Control "no-store" always;
    }

    # /dashboard/ — 反代监控看板 Streamlit (8501) + basic auth
    location /dashboard/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        auth_basic "rQuant Dashboard";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    # /nl/ — 反代 NL 选股 Streamlit (8502) + basic auth
    # 当前与 /dashboard/ 共用 htpasswd；未来想给协作者单独开 NL 时
    # 把本 location 切换到独立 .rquant-nl.htpasswd 即可（监控仍私有）
    location /nl/ {
        proxy_pass http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        auth_basic "rQuant NL 选股";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    # /canvas/ — 反代节点画布 Streamlit (8504) + basic auth
    # Week 7.5 C 阶段：Pool 节点图 + 规则 CRUD + NL 改 pool（共用 DEEPSEEK key）
    location /canvas/ {
        proxy_pass http://127.0.0.1:8504/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        auth_basic "rQuant 画布";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    # /preview/ — 新版看板预览（路线 A，读 RQUANT_SERVING_ROOT 指向的 serving 代，只读）
    # Streamlit 127.0.0.1:8509（lighthouse 进程，非 systemd），与 /dashboard/ 共用 htpasswd
    # 2026-09-24 owner 授权「nginx 加登录路径」
    location /preview/ {
        proxy_pass http://127.0.0.1:8509/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        auth_basic "rQuant Preview";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    # /app/ — rQuant 投研平台新前端（React 静态文件）+ /app/api/ 反代网页 API（rquant-web，127.0.0.1:8768）
    # 2026-09-25 owner 授权「新 nginx 路径 /app/」；与 /dashboard/ /nl/ /canvas/ /preview/ 共用 htpasswd。
    # 静态根 /home/lighthouse/rquant-web/app 是指向当前发布的符号链接：发布与回滚只切链接，不改本文件。
    # nginx（宝塔，用户 www）只经 ACL 对 web/dist 有读权限，做法见 docs/deploy/web-app.md。
    # 前端用 hash 路由（/app/#/panorama），不需要 try_files 回退。
    # Host 带上端口（$host:$server_port）：网页 API 的写接口同源检查要比较 Origin 的 host:port。
    location = /app {
        return 301 /app/;
    }

    location /app/api/ {
        proxy_pass http://127.0.0.1:8768/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Rquant-User $remote_user;
        proxy_read_timeout 60s;
        client_max_body_size 1m;

        auth_basic "rQuant App";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    location /app/assets/ {
        alias /home/lighthouse/rquant-web/app/assets/;
        autoindex off;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        auth_basic "rQuant App";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    location /app/ {
        alias /home/lighthouse/rquant-web/app/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        auth_basic "rQuant App";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    # /upload/ — WebDAV PUT，本地 push 数据到云端（如 risk_blacklist.parquet）
    # 与 /backup/ 下载对称。文件写入 /home/lighthouse/rquant/data/uploads/，
    # 由宝塔 Web 终端的 root 用户后续 mv 到目的地。
    # 单独 htpasswd（写权限隔离 backup 读权限）。
    location /upload/ {
        alias /home/lighthouse/rquant/data/uploads/;

        client_max_body_size 100m;
        client_body_temp_path /tmp/nginx_upload_tmp;

        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        auth_basic "rQuant Upload";
        auth_basic_user_file /www/server/nginx/conf/.rquant-upload.htpasswd;

        # 文件名白名单：只允许 .parquet / .csv / .pdf / .json
        if ($request_filename !~* \.(parquet|csv|pdf|json)$) {
            return 403;
        }
    }

    location = / {
        default_type text/plain;
        return 200 "rQuant API\n  GET  /backup/latest.duckdb.gz\n  GET  /backup/latest.json\n  PUT  /upload/<filename>\n  GET  /dashboard/\n  GET  /nl/\n  GET  /canvas/\n";
    }
}
