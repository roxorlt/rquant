# rQuant Backup API + Dashboard 反代
# 安装到 /www/server/panel/vhost/nginx/rquant-backup.conf（宝塔自动加载）
# 详细部署：deploy/backup-api.md

# /backup/ 专用 access log 格式（dashboard 解析推断"上次 mac 拉取时间"）
log_format rquant_backup '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent';

server {
    listen 8081;
    server_name _;

    client_max_body_size 0;

    # /backup/ — 静态文件 + basic auth（mac 拉云端 DuckDB 快照）
    location /backup/ {
        alias /home/lighthouse/rquant/backup/;
        autoindex off;

        # 单独 access log，dashboard 读取
        access_log /www/server/nginx/logs/rquant-backup-access.log rquant_backup;

        auth_basic "rQuant Backup";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;

        if ($request_filename !~* \.(duckdb\.gz|json)$) {
            return 403;
        }

        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # /dashboard/ — 反代 Streamlit + basic auth
    location /dashboard/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;

        auth_basic "rQuant Dashboard";
        auth_basic_user_file /www/server/nginx/conf/.rquant-backup.htpasswd;
    }

    location = / {
        default_type text/plain;
        return 200 "rQuant API\n  /backup/latest.duckdb.gz\n  /backup/latest.json\n  /dashboard/\n";
    }
}
