        run: |
          set -euo pipefail
          mkdir -p diag-out
          uv run python -m pytest tests/unit/test_zzdiag_probe.py \
            -p no:cacheprovider -o addopts='' -o faulthandler_timeout=300 \
            -s -v --basetemp="${RQUANT_CI_PYTEST_BASETEMP}/diagprobe" \
            2>&1 | tee diag-out/probe.log

      - name: Upload diagnostic probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
