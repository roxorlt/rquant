name: CI

# Manual full-repository quality & unit/integration suite; web-mvp.yml is the PR/main gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      TUSHARE_TOKEN_MAIN: "00000000000000000000000000000000"
      NOTIFY_ENABLED: "false"
      RQUANT_DISABLE_DOTENV: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create private test root
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d)"
          mkdir -p "$root/tmp" "$root/data" "$root/parquet" "$root/logs"
          {
            echo "RQUANT_CI_ROOT=$root"
            echo "TMPDIR=$root/tmp"
            echo "TMP=$root/tmp"
            echo "TEMP=$root/tmp"
            echo "DATA_DIR=$root/data"
            echo "DUCKDB_PATH=$root/data/test.duckdb"
            echo "DUCKDB_READONLY_PATH=$root/data/test_ro.duckdb"
            echo "PARQUET_DIR=$root/parquet"
            echo "LOG_DIR=$root/logs"
          } >> "$GITHUB_ENV"
      - run: python -m pip install uv==0.10.11
      - run: uv sync --frozen
      - name: Lint research and trading core
        run: bash scripts/check-core-quality.sh
      - name: Run Python test suite
        run: uv run pytest -q --basetemp="$RQUANT_CI_ROOT/pytest" tests/
