          name: diag-x64-probe
          path: diag-out/
          if-no-files-found: warn

  diag-x64-red-files:
    name: "[diagnostic] x64 red files (3.12)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create private full-suite test root
        shell: bash
        run: >-
          python scripts/full_suite_shards.py prepare-environment
          --github-env "${GITHUB_ENV}"
          --base-dir "${RUNNER_TEMP}"
          --label "py3.12-diagred"

      - name: Install uv
        run: python -m pip install uv==0.10.11

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install py-spy
        run: python -m pip install py-spy==0.4.1

      - name: Run the three red files with a stack-dumping watchdog
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diag-out
          (
            while true; do
              sleep 420
              stamp="$(date -u +%H%M%S)"
              for pid in $(pgrep -f python || true); do
                py-spy dump --pid "${pid}" --nonblocking \
                  >> "diag-out/py-spy-${stamp}.txt" 2>&1 || true
              done
            done
          ) &
          watchdog=$!
          uv run python -m pytest \
            tests/unit/test_lab_worker.py \
            tests/unit/test_source_broker_v2_service.py \
            tests/unit/test_runtime_resource_admission.py \
            -p no:cacheprovider -o addopts='--strict-markers' \
            -o faulthandler_timeout=300 -rf -q \
            --basetemp="${RQUANT_CI_PYTEST_BASETEMP}/diagred" \
            --junitxml=diag-out/junit-red-files.xml \
            2>&1 | tee diag-out/red-files.log
          status=${PIPESTATUS[0]}
          kill "${watchdog}" 2>/dev/null || true
          echo "pytest exit: ${status}"

      - name: Upload diagnostic red-file evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: diag-x64-red-files-py3.12
          path: diag-out/
          if-no-files-found: warn
