name: Web MVP

# Lightweight gate for the lean React MVP (rquant.web + web/). Minutes, not hours:
# no full suite, no R07 regeneration.
on:
  pull_request:
  push:
    branches: [main, mvp/react-readonly]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TUSHARE_TOKEN_MAIN: "00000000000000000000000000000000"
      NOTIFY_ENABLED: "false"
      RQUANT_DISABLE_DOTENV: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Private test root
        run: |
          root="$(mktemp -d)"; mkdir -p "$root/data" "$root/parquet" "$root/logs"
          {
            echo "DATA_DIR=$root/data"
            echo "DUCKDB_PATH=$root/data/test.duckdb"
            echo "DUCKDB_READONLY_PATH=$root/data/test_ro.duckdb"
            echo "PARQUET_DIR=$root/parquet"
            echo "LOG_DIR=$root/logs"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.11
      - run: uv sync --frozen

      - name: Python lint + API tests
        run: |
          uv run ruff check src/rquant/web src/rquant/backtest src/rquant/factor \
            src/rquant/data_catalog src/rquant/alert_rules.py tests/web
          uv run pytest -q tests/web
      - name: Roadmap module unit tests
        run: |
          uv run pytest -q tests/unit/test_perf_metrics.py tests/unit/test_portfolio_*.py \
            tests/unit/test_backtest_*.py tests/unit/test_overfit*.py \
            tests/unit/test_data_catalog.py tests/unit/test_data_audit.py \
            tests/unit/test_factor.py tests/unit/test_alert_rules.py \
            tests/unit/test_page_control_web_commands.py tests/unit/test_alert_ack_projection.py \
            tests/unit/test_monitor_manual_watchlist.py tests/unit/test_serving_read_models.py

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend lint, typecheck, unit tests, build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build

      - name: OpenAPI types are up to date
        working-directory: web
        run: |
          pnpm run gen:api
          git diff --exit-code -- src/api/openapi.json src/api/schema.d.ts

      - name: E2E smoke (fixture data)
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
